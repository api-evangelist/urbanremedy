aid: urbanremedy
name: Urban Remedy
description: >-
  Urban Remedy is a certified B Corp organic food company founded by Neka
  Pasquale on the belief that food is healing. It makes fresh, organic,
  plant-based, ready-to-eat meals, cold pressed juices, juice cleanses, and
  snacks with fresh, locally sourced ingredients, delivered nationwide and
  sold through its own retail stores and kiosks. The company runs on
  WordPress + WooCommerce, exposing a live public storefront REST surface at
  /wp-json/ alongside its e-commerce site.
